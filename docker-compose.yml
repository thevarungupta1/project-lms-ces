services:
  # Backend API
  backend:
    build:
      context: ./node-web-api
      dockerfile: Dockerfile
    container_name: ces-lms-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_VERSION: v1
      MONGODB_URI: mongodb://admin:admin123@cluster0.uyv1yt2.mongodb.net/ces-lms?authSource=admin
      MONGODB_DB_NAME: ces-lms
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      JWT_REFRESH_EXPIRES_IN: 30d
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: "*"
      CORS_CREDENTIALS: "true"
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: uploads
      LOG_LEVEL: info
      LOG_DIR: logs
    networks:
      - ces-lms-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Frontend Application
  frontend:
    build:
      context: ./react-web-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_API_VERSION: v1
        VITE_API_TIMEOUT: 30000
    container_name: ces-lms-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ces-lms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  ces-lms-network:
    driver: bridge

